apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-cd-agent
  namespace: jenkins
  labels:
    app.kubernetes.io/part-of: jenkins-cicd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-cd-deployer
  namespace: devops-app
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    # ecr-pull-secret only — get/update/patch (deliberately no "create": K8s
    # RBAC cannot restrict "create" by resourceNames since there's no
    # existing object yet to match, so granting create-on-secrets would be
    # unrestrictable-by-name. The secret is bootstrapped once out-of-band by
    # a human; CD only ever refreshes its value from then on. This SA can
    # never read/touch app-secrets or any other secret in this namespace.
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["ecr-pull-secret"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-cd-agent-binding
  namespace: devops-app
subjects:
  - kind: ServiceAccount
    name: jenkins-cd-agent
    namespace: jenkins
roleRef:
  kind: Role
  name: jenkins-cd-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-cd-namespace-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
    resourceNames: ["devops-app"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-cd-namespace-reader-binding
subjects:
  - kind: ServiceAccount
    name: jenkins-cd-agent
    namespace: jenkins
roleRef:
  kind: ClusterRole
  name: jenkins-cd-namespace-reader
  apiGroup: rbac.authorization.k8s.io