apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-ci-agent
  namespace: jenkins
  labels:
    app.kubernetes.io/part-of: jenkins-cicd
# CI never talks to the Kubernetes API (build + push images only) — disabling
# token automount means it structurally CANNOT authenticate to the API server,
# even if a pipeline step tried. This is stronger than simply "no Role bound".
automountServiceAccountToken: false