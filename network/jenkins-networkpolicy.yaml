apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jenkins-default-deny-ingress
  namespace: jenkins
  labels:
    app.kubernetes.io/part-of: jenkins-cicd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jenkins-allow-agents-to-controller
  namespace: jenkins
  labels:
    app.kubernetes.io/part-of: jenkins-cicd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: jenkins-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jenkins
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 50000