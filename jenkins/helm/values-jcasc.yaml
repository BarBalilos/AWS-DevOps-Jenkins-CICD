# jenkins/helm/values-jcasc.yaml
# Configuration as Code (JCasC), layered on top of values.yaml.
# Built incrementally and verified after each addition since JCasC
# errors only surface when the controller pod actually starts.

controller:
  JCasC:
    defaultConfig: false

    configScripts:
      security-realm: |
        jenkins:
          securityRealm:
            local:
              allowsSignup: false
              users:
                - id: "${chart-admin-username}"
                  password: "${chart-admin-password}"
          authorizationStrategy:
            globalMatrix:
              permissions:
                - "Overall/Administer:${chart-admin-username}"

      kubernetes-cloud: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default.svc"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
                containerCapStr: "10"
                templates:
                  - name: "ci-agent"
                    label: "ci-agent"
                    namespace: "jenkins"
                    serviceAccount: "jenkins-ci-agent"
                    idleMinutes: 5
                    podRetention: "never"
                    containers:
                      - name: "python"
                        image: "python:3.11-slim"
                        command: "sleep"
                        args: "9999999"
                        workingDir: "/home/jenkins/agent"
                        resourceRequestCpu: "250m"
                        resourceRequestMemory: "256Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "512Mi"
                        envVars:
                          - secretEnvVar:
                              key: "AWS_ACCESS_KEY_ID"
                              secretName: "jenkins-ecr-credentials"
                              secretKey: "aws-access-key-id"
                          - secretEnvVar:
                              key: "AWS_SECRET_ACCESS_KEY"
                              secretName: "jenkins-ecr-credentials"
                              secretKey: "aws-secret-access-key"
                          - envVar:
                              key: "AWS_DEFAULT_REGION"
                              value: "us-east-1"
                      - name: "kaniko"
                        image: "gcr.io/kaniko-project/executor:v1.23.2-debug"
                        command: "sleep"
                        args: "9999999"
                        workingDir: "/home/jenkins/agent"
                        resourceRequestCpu: "500m"
                        resourceRequestMemory: "512Mi"
                        resourceLimitCpu: "1"
                        resourceLimitMemory: "1Gi"
                        envVars:
                          - secretEnvVar:
                              key: "AWS_ACCESS_KEY_ID"
                              secretName: "jenkins-ecr-credentials"
                              secretKey: "aws-access-key-id"
                          - secretEnvVar:
                              key: "AWS_SECRET_ACCESS_KEY"
                              secretName: "jenkins-ecr-credentials"
                              secretKey: "aws-secret-access-key"
                          - envVar:
                              key: "AWS_DEFAULT_REGION"
                              value: "us-east-1"
                  - name: "cd-agent"
                    label: "cd-agent"
                    namespace: "jenkins"
                    serviceAccount: "jenkins-cd-agent"
                    idleMinutes: 5
                    podRetention: "never"
                    containers:
                      - name: "kubectl"
                        image: "alpine/k8s:1.31.2"
                        command: "sleep"
                        args: "9999999"
                        workingDir: "/home/jenkins/agent"
                        resourceRequestCpu: "250m"
                        resourceRequestMemory: "256Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "512Mi"