# credentials/credentials.example.yaml
# Documents every credential this system uses. Real secret values are
# NEVER committed — this file is a template showing shape + rotation only.

kubernetes_secrets:
  - name: jenkins-ecr-credentials
    namespace: jenkins
    type: Opaque
    keys:
      aws-access-key-id: "<AKIA... — from the jenkins-ci-ecr IAM user>"
      aws-secret-access-key: "<never stored in git>"
    consumed_by: "CI agent pod template (kaniko container) — injected as env vars, never written to disk or logged"
    scope: "ECR push/pull for devops-app-backend and devops-app-worker ONLY — see iam/jenkins-ci-ecr-policy.json. No other AWS permissions."
    rotation: |
      1. aws iam create-access-key --user-name jenkins-ci-ecr   (creates a 2nd active key; AWS allows 2 concurrent keys per user)
      2. kubectl create secret generic jenkins-ecr-credentials -n jenkins \
           --from-literal=aws-access-key-id=<new-id> \
           --from-literal=aws-secret-access-key=<new-secret> \
           --dry-run=client -o yaml | kubectl apply -f -
      3. Trigger a CI build and confirm the push succeeds with the new key.
      4. aws iam delete-access-key --user-name jenkins-ci-ecr --access-key-id <old-id>

jenkins_admin_credential:
  managed_by: "Helm chart (controller.admin.createSecret: true) — auto-generated random password, we never set or see it choose the value"
  secret_name: jenkins
  keys: [jenkins-admin-user, jenkins-admin-password]
  retrieval: "kubectl exec -n jenkins svc/jenkins -c jenkins -- cat /run/secrets/additional/chart-admin-password"
  consumed_by: "JCasC security-realm configScript, via ${chart-admin-username} / ${chart-admin-password} file-based interpolation — never appears as plaintext in any YAML"
  rotation: |
    kubectl delete secret jenkins -n jenkins
    ./scripts/install-jenkins.sh
    (chart regenerates a fresh random password on next install/upgrade since the secret no longer exists)

deliberately_not_used:
  - credential: "Git checkout token"
    reason: "Both source repos (AWS-DevOps-Jenkins-CICD, AWS-DevOps-Kubernetes) are public — anonymous HTTPS clone needs no credential."
  - credential: "GitHub webhook secret"
    reason: "Jenkins has no public Ingress (deliberate — see security section). GitHub cannot reach it, so CI uses SCM polling instead of a webhook. Documented trade-off, not an oversight."
  - credential: "Exported kubeconfig for CD"
    reason: "CD deploys to the SAME cluster Jenkins runs on, so it authenticates via its own in-cluster ServiceAccount (jenkins-cd-agent) rather than an exported/long-lived credential."